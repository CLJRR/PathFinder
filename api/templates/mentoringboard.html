<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentoring System</title>
    <link rel="stylesheet" href="../static/mentoringboard.css" />
    <link rel="stylesheet" href="../static/nav.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="#" class="logo">Mentor System</a>
      <ul>
        <li><a href="/employeeDashboard">Home</a></li>
        <li><a href="/chatbot">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    
    <div class="container">
      <header>
        <img src="logo-placeholder.png" alt="Company Logo" class="logo" />
        <h1>Mentoring System</h1>
        <p>
          We have provided mentors based on your current job description! Take a
          look!
        </p>
      </header>

      <section class="mentor-grid" id="mentorGrid">
        <!-- Mentor cards will be injected here dynamically -->
      </section>
    </div>

    <script>
      // Function to create mentor cards dynamically
      function generateMentorCards(mentors) {
        const mentorGrid = document.getElementById("mentorGrid");
        mentorGrid.innerHTML = ""; // Clear existing content if any

        mentors.forEach((mentor) => {
          const mentorCard = document.createElement("div");
          mentorCard.classList.add("mentor-card");

          mentorCard.innerHTML = `
          <div class="mentor-image">
              <img src="https://via.placeholder.com/100" alt="${mentor.name}">
          </div>
          <h3>${mentor.name}</h3>
          <h3>${mentor.email}</h3>
          <h4>Position: ${mentor.position}</h4>
          <p>Skills: ${
            mentor.skills.length > 0 ? mentor.skills.join(", ") : "N/A"
          }</p>
          <p>${mentor.summary}</p>
      `;

          mentorGrid.appendChild(mentorCard);
        });
      }

      // Fetch mentor data from the JSON file and generate mentor cards
      fetch("/mentor/getall")
        .then((response) => response.json())
        .then((data) => generateMentorCards(data))
        .catch((error) => console.error("Error fetching mentor data:", error));
    </script>
  </body>
</html>
